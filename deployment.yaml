```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-placement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-placement-portal
  template:
    metadata:
      labels:
        app: student-placement-portal
      annotations:
        deployment-version: "2"
    spec:
      containers:
        - name: student-placement-portal
          image: makamsriya/student-placement-portal:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-placement-service
spec:
  type: NodePort
  selector:
    app: student-placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
```
